# Example Docker Compose app for Kiln: a Node API (built from ./app), PostgreSQL, Redis and an nginx front with a
# mounted config. Also uses env_file, an override file (compose.prod.yaml) and a profile (worker).
services:
  web:
    image: nginx:1.29-alpine
    container_name: example-web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      retries: 5

  api:
    build: ./app
    env_file: ./app/defaults.env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      GREETING: ${GREETING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      start_period: 20s
      retries: 5

  worker:
    build: ./worker
    profiles: ["worker"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data

volumes:
  redis-data:
